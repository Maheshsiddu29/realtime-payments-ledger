name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail the build on a download that silently falls back to a proxy mirror.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go mod tidy is up to date
        run: make tidy-check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Test
        run: make test

      # The ledger's correctness depends on concurrent behaviour, so the race
      # detector is a required check rather than an optional one.
      - name: Test with race detector
        run: make test-race

      - name: Coverage
        run: make cover

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts
        # connections, and a service container has no depends_on.
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_SSLMODE: disable
      # A dedicated database, created and migrated by the test harness, so a
      # test run can never touch application data.
      POSTGRES_TEST_DB: ledger_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Proves both directions of every migration before anything relies on
      # the schema.
      - name: Migrate up, down and up again
        # Runs against the 'ledger' database created by the service container.
        # The integration tests use their own POSTGRES_TEST_DB, so the two do
        # not interfere.
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate version
          go run ./cmd/migrate down-all
          go run ./cmd/migrate up
          go run ./cmd/migrate version

      - name: Integration tests
        run: make test-integration

      # Run verbosely so the observed retry and deadlock counts land in the CI
      # log. A deadlock count above zero means lock ordering regressed, and the
      # test asserts it — but having the number visible makes the failure
      # immediately legible.
      - name: Deterministic concurrency tests
        run: make test-concurrency

      # Concurrency correctness has to hold under the race detector too. A
      # database serialization conflict is not a Go data race; both must be
      # clean.
      - name: Integration and concurrency tests with race detector
        run: make test-integration-race

  compose:
    name: Validate Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose config --quiet

  image:
    name: Build container image
    runs-on: ubuntu-latest
    # No point building an image from a tree that does not compile or pass.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: payments-ledger/api:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that cannot answer its own liveness probe is not shippable.
      #
      # No database is attached to this job, which makes it the end-to-end
      # proof of the readiness contract: liveness must stay 200 while
      # readiness reports 503, so a dependency outage withholds traffic
      # without triggering a restart loop.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name api-smoke -p 8080:8080 payments-ledger/api:ci
          trap 'docker logs api-smoke || true; docker rm -f api-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API container never answered /healthz"
              exit 1
            fi
            sleep 1
          done
          echo "liveness: 200 as expected"

          curl -fsS http://127.0.0.1:8080/version >/dev/null
          echo "version: 200 as expected"

          ready_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)
          if [ "$ready_status" != "503" ]; then
            echo "readiness returned $ready_status, want 503 with no database attached"
            exit 1
          fi
          echo "readiness: 503 as expected with no database attached"

          live_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)
          if [ "$live_status" != "200" ]; then
            echo "liveness returned $live_status while unready, want 200"
            exit 1
          fi
          echo "liveness stayed 200 while unready"

